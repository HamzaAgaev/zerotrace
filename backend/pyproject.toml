[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerotrace"
version = "0.1.0"
description = "ZeroTrace + Retry Auditor: OTLP trace analysis and retry/timeout audit"
requires-python = ">=3.11"
dependencies = ["opentelemetry-proto>=1.27", "Flask>=3.1,<4", "requests>=2.32,<3", "waitress>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
py-modules = ["analytics_support"]

[tool.setuptools.packages.find]
include = ["app*", "contracts*", "ingest*", "repository*", "core*", "rules*", "comparison*", "projection*", "evalkit*"]

[tool.setuptools.package-data]
"app.analytics_api" = ["openapi.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

# Product-facing messages in A are intentionally written in Russian.
[tool.ruff.lint.per-file-ignores]
"app/control/*.py" = ["RUF001"]
"app/integrations/*.py" = ["RUF001"]
"app/server/*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
packages = ["contracts"]
strict = true
