<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура ZeroTrace</title>
  <desc id="desc">Обзор телеметрии, управления конфигурацией и лабораторных прогонов ZeroTrace.</desc>
  <defs>
    <marker id="arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#167d78"/></marker>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b66b17"/></marker>
    <marker id="arrow-experiment" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6752aa"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#1d2938}
      .title{font-size:38px;font-weight:750;letter-spacing:-.5px}.subtitle{font-size:17px;fill:#566579}
      .frame-title{font-size:19px;font-weight:700}.heading{font-size:18px;font-weight:700}.body{font-size:15px;fill:#44546a}.small{font-size:13px;fill:#566579}.tiny{font-size:12px;fill:#64748b}
      .frame{fill:#f6f8fb;stroke:#aeb9c8;stroke-width:2}.server{fill:#fff;stroke:#8998aa;stroke-width:1.6}.card{fill:#fff;stroke:#bdc8d5;stroke-width:1.5}.teal-card{fill:#edf8f6;stroke:#76aaa6;stroke-width:1.5}.orange-card{fill:#fff6e9;stroke:#d3a86f;stroke-width:1.5}.purple-card{fill:#f4f1fb;stroke:#9a8ac6;stroke-width:1.5}.db{fill:#f1f4f8;stroke:#77869a;stroke-width:1.6}
      .flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.telemetry{stroke:#167d78;marker-end:url(#arrow-telemetry)}.control{stroke:#b66b17;marker-end:url(#arrow-control)}.experiment{stroke:#6752aa;marker-end:url(#arrow-experiment)}.dashed{stroke-dasharray:8 7}
      .pill{fill:#fff;stroke:#c7d1dc;stroke-width:1}.label{font-size:12.5px;font-weight:650}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="56" y="62" class="title">ZeroTrace · архитектура</text>
  <text x="58" y="94" class="subtitle">Приём OTLP, управление конфигурацией и анализ в одном приложении</text>

  <!-- External actors -->
  <rect x="55" y="147" width="260" height="132" rx="14" class="card"/>
  <text x="78" y="181" class="heading">Приложения пользователя</text>
  <text x="78" y="211" class="body">Сервисы с OTLP SDK</text>
  <text x="78" y="238" class="small">Реальные HTTP-вызовы</text>
  <text x="78" y="260" class="small">Экспорт трейсов по OTLP/HTTP</text>

  <rect x="365" y="157" width="180" height="112" rx="14" class="card" stroke-dasharray="6 5"/>
  <text x="387" y="194" class="heading">Collector</text>
  <text x="387" y="222" class="body">Опциональный</text>
  <text x="387" y="245" class="small">можно подключить</text>

  <rect x="55" y="661" width="260" height="122" rx="14" class="card"/>
  <text x="78" y="696" class="heading">Поддерживаемые</text>
  <text x="78" y="720" class="heading">внешние сервисы</text>
  <text x="78" y="750" class="small">HTTP API конфигурации</text>
  <text x="78" y="771" class="tiny">GET · PATCH · чтение результата</text>

  <!-- Single deployment boundary -->
  <rect x="585" y="125" width="960" height="700" rx="22" class="frame"/>
  <text x="615" y="160" class="frame-title">Контейнер приложения</text>
  <text x="1510" y="160" text-anchor="end" class="small">один backend · один SQLite</text>

  <rect x="620" y="184" width="890" height="86" rx="13" class="server"/>
  <text x="646" y="218" class="heading">Python backend · Flask + Waitress</text>
  <text x="646" y="245" class="body">HTTP API и OTLP endpoint · React UI раздаётся с того же origin</text>

  <rect x="620" y="304" width="260" height="130" rx="13" class="teal-card"/>
  <text x="643" y="340" class="heading">Приём телеметрии</text>
  <text x="643" y="369" class="body">OTLP/HTTP → проверка</text>
  <text x="643" y="394" class="body">и нормализация</text>
  <text x="643" y="418" class="tiny">Реальные экспортированные spans</text>

  <rect x="916" y="304" width="260" height="130" rx="13" class="teal-card"/>
  <text x="939" y="340" class="heading">Модель трасс</text>
  <text x="939" y="369" class="body">TraceGraph · CallModel</text>
  <text x="939" y="394" class="body">Статистика · EdgePolicy</text>
  <text x="939" y="418" class="tiny">Типизированные данные вызовов</text>

  <rect x="1212" y="304" width="298" height="130" rx="13" class="purple-card"/>
  <text x="1235" y="340" class="heading">Аналитика</text>
  <text x="1235" y="369" class="body">Аудит · рекомендации</text>
  <text x="1235" y="394" class="body">сравнения · отчёты</text>
  <text x="1235" y="418" class="tiny">Читает сохранённые данные</text>

  <rect x="620" y="478" width="386" height="142" rx="13" class="orange-card"/>
  <text x="643" y="515" class="heading">Управление</text>
  <text x="643" y="544" class="body">Реестр · план изменений · CAS</text>
  <text x="643" y="569" class="body">применение · readback · журнал</text>
  <text x="643" y="598" class="tiny">Ограничения полей и ревизий</text>

  <rect x="1050" y="478" width="460" height="142" rx="13" class="db"/>
  <ellipse cx="1280" cy="500" rx="204" ry="16" fill="#e8edf3" stroke="#77869a" stroke-width="1.5"/>
  <text x="1280" y="540" text-anchor="middle" class="heading">Общая SQLite база</text>
  <text x="1280" y="570" text-anchor="middle" class="body">телеметрия · планы и операции · аналитика</text>
  <text x="1280" y="596" text-anchor="middle" class="small">снимки конфигурации · frozen trace revisions</text>

  <rect x="620" y="666" width="890" height="116" rx="13" class="purple-card"/>
  <text x="645" y="704" class="heading">Лабораторные процессы стенда</text>
  <text x="645" y="734" class="body">9 HTTP-сервисов с OTLP SDK · запуск и настройка из backend</text>
  <text x="645" y="760" class="small">Нагрузочные прогоны · сценарии ошибок · трассы поступают в общий OTLP endpoint</text>

  <!-- React UI client -->
  <rect x="55" y="365" width="260" height="126" rx="14" class="card"/>
  <text x="78" y="402" class="heading">Браузер оператора</text>
  <text x="78" y="431" class="body">React UI</text>
  <text x="78" y="459" class="small">Запросы только к backend API</text>
  <text x="78" y="479" class="tiny">Тот же origin</text>

  <!-- Telemetry paths -->
  <g class="flow-set flow-telemetry">
    <path d="M315 206H365" class="flow telemetry"/>
    <path d="M315 250H340V290H565V352H620" class="flow telemetry"/>
    <path d="M545 213H565V352H620" class="flow telemetry dashed"/>
    <path d="M880 369H895V450H1025V520H1050" class="flow telemetry"/>
    <path d="M1115 478V434" class="flow telemetry"/>
    <path d="M1176 369H1212" class="flow telemetry"/>
    <path d="M1480 666H1530V286H750V304" class="flow telemetry"/>
  </g>
  <g class="flow-set flow-control">
    <path d="M315 410H565V227H620" class="flow control"/>
    <path d="M620 250H600V550H620" class="flow control"/>
    <path d="M1006 546H1050" class="flow control"/>
    <path d="M620 583H570V722H315" class="flow control"/>
  </g>
  <g class="flow-set flow-experiment">
    <path d="M800 620V666" class="flow experiment"/>
    <path d="M1060 666V640H745V620" class="flow experiment"/>
  </g>

  <text x="1127" y="462" class="tiny">чтение</text>
  <!-- Flow labels -->
  <g>
    <rect x="350" y="276" width="110" height="24" rx="12" class="pill"/><text x="405" y="293" text-anchor="middle" class="label" fill="#167d78">OTLP/HTTP</text>
    <rect x="382" y="398" width="132" height="24" rx="12" class="pill"/><text x="448" y="415" text-anchor="middle" class="label">HTTP API</text>
    <rect x="336" y="710" width="110" height="24" rx="12" class="pill"/><text x="391" y="727" text-anchor="middle" class="label">GET / PATCH</text>
    <rect x="625" y="631" width="117" height="24" rx="12" class="pill"/><text x="683" y="648" text-anchor="middle" class="label">запуск / сбои</text>
    <rect x="900" y="438" width="80" height="23" rx="11" class="pill"/><text x="940" y="454" text-anchor="middle" class="tiny">запись</text>
  </g>

  <text x="56" y="852" class="small">Collector можно добавить между OTLP экспортёром и приёмом; прямой OTLP/HTTP работает без него.</text>
  <g transform="translate(1100 850)">
    <line x1="0" y1="0" x2="36" y2="0" class="flow telemetry"/><text x="46" y="5" class="small">телеметрия</text>
    <line x1="148" y1="0" x2="184" y2="0" class="flow control"/><text x="194" y="5" class="small">управление</text>
    <line x1="300" y1="0" x2="336" y2="0" class="flow experiment"/><text x="346" y="5" class="small">прогон</text>
  </g>
</svg>
